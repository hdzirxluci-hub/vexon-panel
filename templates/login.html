<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <title>ورود | Xray Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="min-h-screen bg-black text-white flex items-center justify-center p-4 overflow-hidden">

    <!-- پس‌زمینه گرادیان متحرک -->
    <div class="fixed inset-0 bg-gradient-to-br from-purple-900/30 via-black to-indigo-900/30 -z-10"></div>
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl -z-10"></div>
    <div class="fixed bottom-0 right-0 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl -z-10"></div>

    <!-- دکمه تغییر زبان -->
    <button onclick="toggleLang()" class="fixed top-4 left-4 bg-white/5 backdrop-blur-xl border border-white/10 rounded-full px-4 py-2 text-sm hover:bg-white/10 transition">
        <span id="langBtn">🇬🇧 EN</span>
    </button>

    <!-- کارت لاگین -->
    <div class="w-full max-w-sm bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl p-8 shadow-2xl">
        
        <!-- لوگو -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-purple-500/50">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold" data-fa="ورود به پنل" data-en="Panel Login">ورود به پنل</h1>
            <p class="text-white/50 text-sm mt-1" data-fa="برای ادامه وارد شوید" data-en="Sign in to continue">برای ادامه وارد شوید</p>
        </div>

        <!-- پیام خطا -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="bg-red-500/10 border border-red-500/30 text-red-300 text-sm rounded-xl p-3 mb-4 text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- فرم -->
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs text-white/60 mb-2" data-fa="نام کاربری" data-en="Username">نام کاربری</label>
                <input type="text" name="username" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-purple-500 focus:bg-white/10 transition"
                    placeholder="admin">
            </div>
            <div>
                <label class="block text-xs text-white/60 mb-2" data-fa="رمز عبور" data-en="Password">رمز عبور</label>
                <input type="password" name="password" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-purple-500 focus:bg-white/10 transition"
                    placeholder="••••••••">
            </div>
            <button type="submit"
                class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-purple-500/30 transition active:scale-95"
                data-fa="ورود" data-en="Sign In">ورود</button>
        </form>

        <p class="text-center text-white/30 text-xs mt-6">
            Xray Panel © 2024
        </p>
    </div>

    <script>
        function toggleLang() {
            const html = document.getElementById('htmlRoot');
            const btn = document.getElementById('langBtn');
            const isFa = html.getAttribute('lang') === 'fa';
            const newLang = isFa ? 'en' : 'fa';
            
            html.setAttribute('lang', newLang);
            html.setAttribute('dir', isFa ? 'ltr' : 'rtl');
            btn.textContent = isFa ? '🇮🇷 FA' : '🇬🇧 EN';
            
            document.querySelectorAll('[data-fa]').forEach(el => {
                el.textContent = el.getAttribute('data-' + newLang);
            });
            
            localStorage.setItem('lang', newLang);
        }
        
        // اعمال زبان ذخیره شده
        if (localStorage.getItem('lang') === 'en') toggleLang();
    </script>
</body>
</html>
