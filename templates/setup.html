<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <title>نصب | Xray Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="min-h-screen bg-black text-white flex items-center justify-center p-4">

    <div class="fixed inset-0 bg-gradient-to-br from-purple-900/30 via-black to-indigo-900/30 -z-10"></div>
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl -z-10"></div>

    <button onclick="toggleLang()" class="fixed top-4 left-4 bg-white/5 backdrop-blur-xl border border-white/10 rounded-full px-4 py-2 text-sm">
        <span id="langBtn">🇬🇧 EN</span>
    </button>

    <div class="w-full max-w-sm bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl p-8 shadow-2xl">

        <div class="flex flex-col items-center mb-6">
            <div class="w-16 h-16 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-purple-500/50">
                <span class="text-3xl">🎉</span>
            </div>
            <h1 class="text-2xl font-bold" data-fa="خوش آمدی!" data-en="Welcome!">خوش آمدی!</h1>
            <p class="text-white/50 text-sm mt-1 text-center" data-fa="حساب ادمین اصلی رو بساز" data-en="Create your admin account">حساب ادمین اصلی رو بساز</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="bg-red-500/10 border border-red-500/30 text-red-300 text-sm rounded-xl p-3 mb-4 text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs text-white/60 mb-2" data-fa="نام کاربری" data-en="Username">نام کاربری</label>
                <input type="text" name="username" required minlength="3"
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-purple-500 transition"
                    placeholder="admin">
            </div>
            <div>
                <label class="block text-xs text-white/60 mb-2" data-fa="رمز عبور" data-en="Password">رمز عبور</label>
                <input type="password" name="password" required minlength="6"
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-purple-500 transition"
                    placeholder="••••••••">
            </div>
            <div>
                <label class="block text-xs text-white/60 mb-2" data-fa="تکرار رمز" data-en="Confirm Password">تکرار رمز</label>
                <input type="password" name="password2" required minlength="6"
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-purple-500 transition"
                    placeholder="••••••••">
            </div>
            <button type="submit"
                class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-purple-500/30 transition active:scale-95"
                data-fa="🚀 شروع" data-en="🚀 Get Started">🚀 شروع</button>
        </form>

        <p class="text-white/40 text-xs text-center mt-6" data-fa="این اطلاعات رو جایی ذخیره کن!" data-en="Save these credentials safely!">این اطلاعات رو جایی ذخیره کن!</p>
    </div>

    <script>
        function toggleLang() {
            const html = document.getElementById('htmlRoot');
            const btn = document.getElementById('langBtn');
            const isFa = html.getAttribute('lang') === 'fa';
            const newLang = isFa ? 'en' : 'fa';
            html.setAttribute('lang', newLang);
            html.setAttribute('dir', isFa ? 'ltr' : 'rtl');
            btn.textContent = isFa ? '🇮🇷 FA' : '🇬🇧 EN';
            document.querySelectorAll('[data-fa]').forEach(el => {
                el.textContent = el.getAttribute('data-' + newLang);
            });
            localStorage.setItem('lang', newLang);
        }
        if (localStorage.getItem('lang') === 'en') toggleLang();
    </script>
</body>
</html>
